name: Docs gates

# The only layer a committer cannot skip. The pre-commit and pre-push hooks are
# real defences but they are LOCAL: `--no-verify` skips them, core.hooksPath can
# be repointed, and the hook file can be edited. That is not a criticism of the
# hooks — it is why this job exists, exactly as opsec-check.yml exists behind the
# opsec hooks.
#
# NOTE: no step here ends in `|| echo`. The three checks in docs.yml do, which
# means none of them can fail a build — they have been reporting into the void.
# Do not copy that pattern into this file.
#
# To make this genuinely unbypassable it must also be a REQUIRED status check in
# branch protection. Without that, a push can land with this job red.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  docs-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the history-dependent gates need a diff base

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ------------------------------------------------------------------
      # THE DIFF BASE. Three of the eleven gates (dox, verify-fixes, partial)
      # measure "what did this branch ADD" and get their base from
      # tools/docs-audit/lib.mjs auditBase(), whose second candidate is
      # `@{upstream}`. On a push, actions/checkout creates the local branch from
      # refs/remotes/origin/<branch> — which, because this job runs AFTER the
      # push, already equals github.sha. So the base resolved to the commit under
      # test, `git diff BASE...HEAD` was empty, and verify-fixes printed
      #     audit-introduced doc lines examined: 0
      #     VERIFY-FIXES: PASS
      # having examined nothing. Reproduced by cloning this repo and running the
      # gate with no AUDIT_BASE: 0 lines, PASS. Pull requests were unaffected,
      # because checkout leaves them on a detached merge ref with no upstream —
      # so the gates worked on the event a human is already reviewing and were
      # blind on the event nobody looks at.
      #
      # Resolved here instead. The candidate is VALIDATED before export. auditBase() SKIPS an
      # AUDIT_BASE that does not resolve or shares no history, and falls through
      # to `@{upstream}` — i.e. an unusable value here silently restores the
      # vacuous pass. An empty export is therefore refused loudly by the next
      # step rather than passed on.
      - name: Resolve the diff base this run measures
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TIP='${{ github.event.pull_request.head.sha }}'
            CAND='${{ github.event.pull_request.base.sha }}'
          else
            TIP='${{ github.sha }}'
            BEFORE='${{ github.event.before }}'
            case "$BEFORE" in
              ''|0000000000000000000000000000000000000000)
                # Brand-new branch: no "before" to diff against. Deliberately
                # the fork point, not HEAD~1 — a first push carrying N commits
                # would otherwise check one and report green on the other N-1.
                CAND="$(git merge-base "origin/${{ github.event.repository.default_branch }}" "$TIP" 2>/dev/null || true)"
                ;;
              *) CAND="$BEFORE" ;;
            esac
          fi

          BASE=''
          if [ -n "$CAND" ] \
             && git rev-parse --verify --quiet "$CAND^{commit}" >/dev/null \
             && git merge-base "$CAND" "$TIP" >/dev/null 2>&1 \
             && [ "$(git rev-parse "$CAND")" != "$(git rev-parse "$TIP")" ]; then
            BASE="$CAND"
          fi

          echo "tip   : $TIP"
          echo "base  : ${BASE:-<unresolved>}"
          echo "AUDIT_BASE=$BASE"   >> "$GITHUB_ENV"

      - name: Run every documentation gate
        run: |
          set -eu
          if [ -z "${AUDIT_BASE:-}" ]; then
            echo "::error::no usable diff base for this run — the history gates would examine an EMPTY diff and report PASS."
            echo "A gate that cleared nothing must not report success. Push from a branch that shares history with the default branch, or set AUDIT_BASE explicitly."
            exit 1
          fi
          # Printed here, not left to the gates. The runner truncates each gate
          # to its verdict line, so "examined: 0" would not be visible in the
          # summary — and "examined nothing" is precisely the state this step
          # exists to make impossible to miss.
          echo "history gates measure ${AUDIT_BASE}...HEAD"
          git diff --shortstat "${AUDIT_BASE}...HEAD" -- '*.md' '*.mdx' | sed 's/^/doc diff: /' || true
          node scripts/docs-gates.mjs

      # Ten of the eleven gates ship planted near-misses proving their detector
      # returns BOTH answers, and until now no enforcement layer ran a single
      # one of them. A detector only ever observed passing is not known to fire,
      # which is the same defect as a gate that cannot fail — one level down.
      #
      # No exception mechanism, deliberately. An earlier draft ran this step as
      # --allow-failing=mechanized, allowlisting check-mechanized's regression
      # guard ("no doc reasserts an unwired symbol"), which was red because
      # DOCUMENTS_GAP failed to suppress the PLURAL "has no callers" in
      # .ai-docs/TEE_Attestation_Architecture.md:175. The suppressor was repaired
      # instead, and the flag was REMOVED from scripts/docs-gates.mjs with it:
      # an exception path with no caller and no selftest of its own is the shape
      # that hides the next real failure, which is the defect this whole step
      # exists to prevent.
      - name: Prove each gate's detector still fires
        if: always()
        run: node scripts/docs-gates.mjs --selftests
