<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <title>Morpheus</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    /> -->

    <!-- <meta http-equiv="Content-Security-Policy" content="default-src * self blob: data: gap:; style-src * self 'unsafe-inline' blob: data: gap:; script-src * 'self' 'unsafe-eval' 'unsafe-inline' blob: data: gap:; object-src * 'self' blob: data: gap:; img-src * self 'unsafe-inline' blob: data: gap:; connect-src self * 'unsafe-inline' blob: data: gap:; frame-src * self blob: data: gap:;"> -->

    <style>

      /* Aurora design system — fonts self-hosted locally (B7: no runtime
         font fetch from Google). See src/renderer/src/assets/fonts/. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('./src/assets/fonts/Inter-Variable.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./src/assets/fonts/RobotoMono-400.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('./src/assets/fonts/RobotoMono-500.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./src/assets/fonts/RobotoMono-700.woff2') format('woff2');
      }

      .grecaptcha-badge {
        visibility: hidden;
      }

      html {
        font-size: 10px;
      }

      ::-webkit-scrollbar {
          background-color: #04070c;
          width: 16px /* 20px / 16px */;
      }

      ::-webkit-scrollbar-thumb {
          background-color: #6fd6ff80;
          border: 0.25em /* 4px / 16px */ solid #03160d;
          border-radius: 16px /* 20px / 16px  #2c2c2c */;
      }

      ::-webkit-scrollbar-corner {
        background-color: #04070c;
      }

      body {
        margin: 0;
        padding: 0;
        /* JARVIS: near-black blue, monospace console voice. */
        background: #04070c!important;
        font-family: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-style: normal;
        font-weight: 400!important;
        color: #e6f1fa!important;
        font-size: 1.5rem!important;
        -webkit-font-smoothing: antialiased;
      }

      *,
      *:before,
      *:after {
        box-sizing: border-box;
        font-optical-sizing: auto;
        font-style: normal;
      }

      /* Data/terminal texture — balances, addresses, hashes, session IDs. */
      .mono {
        font-family: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      /* Required by Reach UI. See https://github.com/reach/reach-ui/blob/master/packages/menu-button/styles.css#L1 */
      :root {
        --reach-menu-button: 1;
      }
    </style>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
