<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <title>Morpheus</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    /> -->

    <!-- <meta http-equiv="Content-Security-Policy" content="default-src * self blob: data: gap:; style-src * self 'unsafe-inline' blob: data: gap:; script-src * 'self' 'unsafe-eval' 'unsafe-inline' blob: data: gap:; object-src * 'self' blob: data: gap:; img-src * self 'unsafe-inline' blob: data: gap:; connect-src self * 'unsafe-inline' blob: data: gap:; frame-src * self blob: data: gap:;"> -->


    <style>

      /* Fonts are self-hosted — no runtime fetch from Google. This app is a
         wallet: a stylesheet <link> to fonts.googleapis.com told Google the
         user's IP every launch, and offline (or behind a filter) the whole
         mono HUD voice silently fell back to a system font. 87KB of woff2
         buys back both the privacy and the offline fidelity. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('./src/assets/fonts/Inter-Variable.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./src/assets/fonts/RobotoMono-400.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('./src/assets/fonts/RobotoMono-500.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Roboto Mono';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./src/assets/fonts/RobotoMono-700.woff2') format('woff2');
      }
  
      .grecaptcha-badge { 
        visibility: hidden;
      }
  
      html {
        font-size: 10px;
      }

      /* Colour lives in src/ui/GlobalStyle.ts, not here. This file is static
         HTML: it cannot read the theme, so any colour written here is frozen to
         one variant forever — and `background: #03160e!important` was frozen to
         classic AND unoverridable, which is why selecting Aurora still left a
         green page and green scrollbars behind onboarding and Login.
         Everything kept below is genuinely theme-independent. */

      body {
        margin: 0;
        padding: 0;
        font-family: 'Montserrat', sans-serif;
        font-style: normal;
        font-weight: 400!important;
        font-size: 1.6rem!important;
        -webkit-font-smoothing: antialiased;
      }
  
      *,
      *:before,
      *:after {
        box-sizing: border-box;
        font-family: "Roboto Mono", monospace;
        font-optical-sizing: auto;
        font-style: normal;
      }

      /* Required by Reach UI. See https://github.com/reach/reach-ui/blob/master/packages/menu-button/styles.css#L1 */
      :root {
        --reach-menu-button: 1;
      }
    </style>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
